<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResearchProf</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;grid-template-columns:minmax(300px,400px) 1fr;font-family:system-ui,sans-serif;background:#f7f8fa;color:#1b2430}
.chat{display:flex;flex-direction:column;background:#fff;border-right:1px solid #e3e7ee;min-height:0}
.head{padding:16px 20px;font-weight:650;border-bottom:1px solid #e3e7ee}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:90%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.45}
.user{align-self:flex-end;background:#e8eefc}
.bot{align-self:flex-start;background:#f1f3f7}
.err{background:#fdeceb;color:#c0362c}
form{display:flex;gap:8px;padding:14px;border-top:1px solid #e3e7ee}
input{flex:1;padding:12px 14px;font-size:15px;border:1px solid #e3e7ee;border-radius:999px;outline:none}
button{padding:0 18px;border:0;border-radius:999px;background:#1f4fd8;color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
.res{display:flex;flex-direction:column;min-height:0}
.rh{padding:16px 24px;border-bottom:1px solid #e3e7ee;background:#fff;font-weight:650}
#out{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:16px}
.card h3{margin:0 0 2px;font-size:16px}
.sub{color:#6b7788;font-size:14px}
.card ul{margin:10px 0;padding-left:18px;font-size:14px;line-height:1.5}
a{color:#1f4fd8;text-decoration:none;font-size:13px;margin-right:14px}
@media(max-width:800px){body{grid-template-columns:1fr;grid-template-rows:55% 45%}}
</style>
</head>
<body>
<section class="chat">
  <div class="head">🔬 ResearchProf</div>
  <div id="msgs"></div>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="e.g. professors at UNC or NC State studying AI">
    <button id="b">Send</button>
  </form>
</section>
<section class="res">
  <div class="rh">Professors <span id="n" style="font-weight:400;color:#6b7788"></span></div>
  <div id="out"><p class="sub">Results will show up here.</p></div>
</section>
<script src="app.js"></script>
</body>
</html>
